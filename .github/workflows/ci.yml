name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The app links libmpv and opens a GL window, so both have to be present to build and to
      # run the tests; the headers for the window system come with eframe's x11/wayland support.
      - name: libmpv and window headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev

      - name: libmpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Windows is type-checked but not linked or run: there is no libmpv import library for MSVC
      # on the runner, and packaging there is not written yet. Linking is the only thing this skips.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
