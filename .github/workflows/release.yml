name: Release

# A tag is the whole trigger: `git tag v0.1.0 && git push origin v0.1.0` builds the bundle on both
# Mac architectures and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macOS:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # An app bundle has to be built on the architecture it links libmpv for, so both Macs
          # build their own. `macos-15` means Apple silicon these days and the Intel image carries
          # the `-intel` suffix; the first step refuses the job if a label changes meaning under us.
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check the runner really is ${{ matrix.arch }}
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libmpv
        run: brew install mpv

      - name: Bundle
        run: cargo xtask bundle

      - name: Check the bundle carries its own libraries
        run: |
          set -eux
          lipo -archs target/DRTV.app/Contents/MacOS/drtv-desktop
          codesign -v --deep target/DRTV.app
          # Nothing in the bundle may still be answered by the build machine's Homebrew.
          ! otool -L target/DRTV.app/Contents/MacOS/drtv-desktop | grep -q /opt/homebrew
          ! otool -L target/DRTV.app/Contents/MacOS/drtv-desktop | grep -q /usr/local/opt
          ls target/DRTV.app/Contents/Frameworks | wc -l

      - name: Package
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="DRTV-${tag#v}-macos-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent target/DRTV.app "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.zip.sha256
          if-no-files-found: error

  Linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The build machine decides the glibc floor of the artifact, and the artifact has to keep
      # running on distributions older than this year's runner image. The script installs its own
      # toolchain, bundles, and opens a window on a virtual display before it returns.
      - name: Bundle inside Ubuntu 24.04
        run: docker run --rm -v "$PWD:/work" -w /work ubuntu:24.04 ./.github/linux-release.sh

      - name: Package
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="DRTV-${tag#v}-linux-x86_64"
          tar -C target -czf "$name.tar.gz" drtv-desktop-linux
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256
          if-no-files-found: error

  Windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `lib.exe` and `dumpbin` are not on the runner's PATH, and both are needed to turn a DLL into
      # something the MSVC linker will accept.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: libmpv for MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup component add llvm-tools-preview

          # The development archive ships a MinGW import library and the DLL; `libmpv2-sys` asks the
          # MSVC linker for `mpv`, so the import library is made from the DLL's own export table.
          $release = Invoke-RestMethod 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
            -Headers @{ 'User-Agent' = 'drtv-desktop-ci' }
          $asset = $release.assets |
            Where-Object { $_.name -like 'mpv-dev-x86_64-2*.7z' } |
            Select-Object -First 1
          if (-not $asset) { throw 'no mpv-dev-x86_64 archive in the latest mpv build' }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x -y mpv-dev.7z -ompv | Out-Null

          $readobj = Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin\llvm-readobj.exe'
          $exports = & $readobj --coff-exports mpv\libmpv-2.dll |
            Select-String -Pattern '^\s+Name:\s+(\S+)\s*$' |
            ForEach-Object { '  ' + $_.Matches[0].Groups[1].Value }
          if ($exports.Count -lt 100) { throw "only $($exports.Count) exports in libmpv-2.dll" }
          @('LIBRARY libmpv-2.dll', 'EXPORTS') + $exports | Set-Content mpv\mpv.def -Encoding ascii
          lib /nologo /def:mpv\mpv.def /machine:x64 /out:mpv\mpv.lib
          if (-not (Test-Path mpv\mpv.lib)) { throw 'lib.exe produced no import library' }
          "DRTV_MPV_LIB_DIR=$PWD\mpv" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Bundle
        run: cargo xtask bundle

            # Everything the exe imports has to be either beside it or part of Windows itself.
      - name: The exe brings its own libmpv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'target\drtv-desktop-windows'
          $readobj = Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin\llvm-readobj.exe'
          $needed = & $readobj --coff-imports (Join-Path $dir 'drtv-desktop.exe') |
            Select-String -Pattern '^\s+Name:\s+(\S+)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($needed -notcontains 'libmpv-2.dll') { throw 'the exe does not import libmpv-2.dll' }
          # `api-ms-win-*` and `ext-ms-win-*` are API sets: they are not files anywhere, the loader
          # resolves them through the schema, so looking for them on disk finds nothing and means
          # nothing.
          $missing = $needed | Where-Object {
            $_ -notmatch '^(api|ext)-ms-win-' -and
            -not (Test-Path (Join-Path $dir $_)) -and
            -not (Test-Path (Join-Path $env:SystemRoot "System32\$_"))
          }
          if ($missing) { throw "not bundled and not part of Windows: $($missing -join ', ')" }
          "imports: $($needed -join ', ')"

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          $name = "DRTV-$($tag -replace '^v','')-windows-x86_64"
          Compress-Archive -Path 'target\drtv-desktop-windows' -DestinationPath "$name.zip"
          # Written with LF, because a checksum file with CRLF in it names a file that is one
          # character longer than the one on disk, and `sha256sum -c` on Linux then finds nothing.
          $sum = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\$name.zip.sha256", "$sum  $name.zip`n")
          "NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.zip.sha256
          if-no-files-found: error

  release:
    needs: [macOS, Linux, Windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          title="DRTV desktop $tag"
          notes="docs/releases/$tag.md"
          text=(--generate-notes)
          if [ -f "$notes" ]; then
            text=(--notes-file "$notes")
          fi
          # Re-running a tag has to work: a release that is already up gets its files replaced
          # rather than a second, empty one beside it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" "${text[@]}"
          else
            gh release create "$tag" dist/* --title "$title" --verify-tag "${text[@]}"
          fi
